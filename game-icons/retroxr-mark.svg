<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="retroXR">
  <title>retroXR</title>

  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#0b0f1c"/>
    </radialGradient>

    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e4ebfa"/>
      <stop offset="1"    stop-color="#b9c5e0"/>
    </linearGradient>

    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8090b3"/>
      <stop offset="1" stop-color="#55628a"/>
    </linearGradient>

    <radialGradient id="phos" cx="0.5" cy="0.40" r="0.68">
      <stop offset="0"    stop-color="#c9ffe9"/>
      <stop offset="0.30" stop-color="#5cf0b8"/>
      <stop offset="0.68" stop-color="#1cc98e"/>
      <stop offset="1"    stop-color="#053b2c"/>
    </radialGradient>

    <pattern id="scan" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="8" fill="#02160f" opacity="0.34"/>
    </pattern>

    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="frame"><rect width="1024" height="1024"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <ellipse cx="512" cy="512" rx="380" ry="270" fill="#1cc98e" opacity="0.16" filter="url(#bloom)"/>

    <!-- The shell is deliberately chunky — 840 x 520 in a 1024 box, just over
         half the frame's height. An earlier pass was 800 x 320 (31%) and the
         headset vanished into the backdrop once the tile got small. -->
    <g filter="url(#drop)">
      <rect x="24"  y="412" width="88" height="200" rx="40" fill="url(#strap)"/>
      <rect x="912" y="412" width="88" height="200" rx="40" fill="url(#strap)"/>

      <rect x="92" y="252" width="840" height="520" rx="150" ry="150"
            fill="url(#shell)" stroke="#0b0f1c" stroke-width="12"/>

      <path d="M92 402 A150 150 0 0 1 242 252 L782 252 A150 150 0 0 1 932 402 Z"
            fill="#ffffff" opacity="0.5"/>

      <circle cx="332" cy="512" r="168" fill="#0b0f1c"/>
      <circle cx="692" cy="512" r="168" fill="#0b0f1c"/>
      <circle cx="332" cy="512" r="150" fill="url(#phos)"/>
      <circle cx="692" cy="512" r="150" fill="url(#phos)"/>
      <circle cx="332" cy="512" r="150" fill="url(#scan)"/>
      <circle cx="692" cy="512" r="150" fill="url(#scan)"/>

      <!-- one lit pixel: something is running in there -->
      <rect x="284" y="464" width="42" height="42" fill="#f2fffa"/>

      <circle cx="332" cy="512" r="150" fill="none" stroke="#0b0f1c" stroke-width="14"/>
      <circle cx="692" cy="512" r="150" fill="none" stroke="#0b0f1c" stroke-width="14"/>
    </g>
  </g>
</svg>
