name: Release

# Builds the five GDExtensions, exports the signed Quest APK and the Windows
# desktop build, publishes them to a GitHub Release, and points the SideQuest
# listing at the new APK.
#
# A tag build does all of it. A manual dispatch defaults to build-and-artifact
# only, so the whole pipeline can be exercised without cutting a release or
# touching the live listing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release from this build
        type: boolean
        default: false
      notify:
        description: Send the SideQuest webhook (needs publish)
        type: boolean
        default: false

env:
  GODOT_VERSION: 4.7-stable
  GODOT_TEMPLATE_DIR: 4.7.stable

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- preflight
  # Both of these are only otherwise discoverable after a ~30 minute build.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.v.outputs.name }}
      version_code: ${{ steps.v.outputs.code }}
      apk_name: ${{ steps.v.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Read and check the preset versions
        id: v
        run: |
          set -euo pipefail
          cfg=RetroXR/export_presets.cfg
          name=$(sed -n 's/^version\/name="\(.*\)"$/\1/p' "$cfg" | head -1)
          code=$(sed -n 's/^version\/code=\([0-9]*\)$/\1/p' "$cfg" | head -1)
          [ -n "$name" ] && [ -n "$code" ] || { echo "::error::could not parse version/name+code from $cfg"; exit 1; }
          echo "preset: name=$name code=$code"

          # custom_features pairs with a run/main_scene.<tag> override and would
          # reroute the boot scene for every APK exported from the tree.
          if grep -q '^custom_features="..*"' "$cfg"; then
            echo "::error::custom_features is set in $cfg - it must be empty"; exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$name" ] || {
              echo "::error::tag $GITHUB_REF_NAME does not match version/name=$name"; exit 1; }
          fi

          # SideQuest refuses any build whose versionCode is not higher than the
          # one already listed, so a stale code is a wasted release.
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then
            # export_presets.cfg only became tracked in 7785958, so it is absent
            # from v0.2.0 and earlier; a missing file just skips the comparison.
            prev_code=$(git show "$prev:$cfg" 2>/dev/null | sed -n 's/^version\/code=\([0-9]*\)$/\1/p' | head -1 || true)
            echo "previous tag $prev had code=${prev_code:-<not tracked>}"
            if [ -n "$prev_code" ] && [ "$code" -le "$prev_code" ]; then
              echo "::error::version/code=$code is not greater than $prev_code (tag $prev) - SideQuest would reject it"
              exit 1
            fi
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "apk=RetroXR-v$name.apk" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------- quest
  quest:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          # The build-stamp export plugin runs `git describe --tags`; a shallow
          # clone silently stamps an empty build_info.json.
          fetch-depth: 0

      - name: Reclaim disk
        run: |
          # A ~225 MB APK, a ~2 GB android build dir, godot-cpp objects and the
          # LFS assets do not comfortably fit the runner's default free space.
          # The Android SDK itself must survive - the gradle export needs it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # Two different NDKs are in play and they are not interchangeable:
      # gradle pins 29.0.14206865 in RetroXR/android/build/config.gradle, while
      # Tools/build.py compiles the GDExtensions with r27d.
      - name: Android SDK packages for the gradle build
        run: |
          set -euo pipefail
          # The runner ships the SDK but puts nothing on PATH, and the
          # cmdline-tools directory is versioned, so glob for it.
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sm=$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          [ -x "$sm" ] || { echo "::error::no sdkmanager under $sdk/cmdline-tools"; exit 1; }
          echo "using $sm"
          yes | "$sm" --licenses > /dev/null 2>&1 || true
          "$sm" --install "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" > /dev/null
      # local-cache is off deliberately. With it on, the action saved a 588 MiB
      # entry and restored it in 7s instead of the 56s a real install takes, but
      # the restored tree's clang++ was unusable ("sh: clang++: not found" - the
      # NDK's compiler drivers are symlinks and do not survive the round trip).
      # The action reports success either way, so the failure only surfaced deep
      # in the build as exit 127. Under a minute is not worth that.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r27d, local-cache: false }

      - name: Check the NDK toolchain is actually usable
        run: |
          set -euo pipefail
          cxx="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          [ -x "$cxx" ] && "$cxx" --version || {
            echo "::error::NDK at ${{ steps.ndk.outputs.ndk-path }} has no working clang++"; exit 1; }

      - run: pip install scons

      # vlc-godot links the system libVLC on Linux rather than a vendored copy.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libvlc-dev

      # Build through a short path, because archiving godot-cpp is a hair from
      # the kernel's 131,072 byte cap on a single argv entry - which is what
      # SCons' "sh -c <command>" makes the whole command line into.
      #
      # godot-cpp is 1022 objects. libretro-godot builds from the repo root and
      # names them relatively (95,892 bytes), so it fits. The four siblings
      # reach godot-cpp from outside their own top directory, so SCons switches
      # to absolute paths: 130,640 bytes, and adding "llvm-ar rc <archive>"
      # tips it over into "sh: Argument list too long". Note the exec of sh
      # itself is what fails, so wrapping ar to take an @response file does not
      # help - nothing downstream of that exec ever runs. SCONS_CACHE does not
      # save it either: the objects come back from cache, but the archive can
      # only come back if some build once produced it in that form, and none can.
      #
      # /home/runner/work/RetroXR/RetroXR/ -> /w/ takes 31 bytes off all 1022,
      # landing at 98,958, about the headroom the root build already runs with.
      # A bind mount rather than a symlink, so build.py's Path.resolve() cannot
      # collapse it back to the long path.
      - name: Mount the workspace at a short path
        run: |
          set -euo pipefail
          sudo mkdir -p /w
          sudo mount --bind "$GITHUB_WORKSPACE" /w
          test -f /w/Tools/build.py
          python -c "from pathlib import Path; print('build.py resolves to', Path('/w/Tools/build.py').resolve())"

      # SCONS_CACHE is load-bearing, not just a speed-up. Each extension has
      # its own VariantDir and .sconsign, so all five otherwise rebuild
      # godot-cpp from scratch - and the four siblings reference it as
      # ../libretro-godot/godot-cpp/..., which makes SCons emit absolute object
      # paths and blow the shell's argument limit when archiving ~2000 of them
      # ("sh: Argument list too long"). godot-cpp's SConstruct sets
      # Decider("MD5") alongside CacheDir, so the content-addressed entries
      # libretro-godot populates are valid from the siblings' directories: they
      # retrieve the archive instead of re-running ar. Populated and consumed
      # within this one job, so nothing depends on cross-run cache retention.
      - name: Build the five GDExtensions (android arm64, release)
        env:
          # build.py blanks ANDROID_HOME itself: godot-cpp prefers it when set
          # and then demands a full SDK.
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: python /w/Tools/build.py android --target release --jobs 4

      # The exporting editor is a debug-tagged Linux binary, so it resolves
      # linux.debug.x86_64 out of each .gdextension and loads THAT to register
      # Libretro/VerletRope in ClassDB. Without it every script naming those
      # types fails to parse and the export runs over unresolved scenes.
      # Nothing debug ships: the APK gets android.release.arm64, picked by the
      # exported game's own feature tags.
      # build.py skips metaxr-audio here - it has no linux stanza at all (Meta
      # ships that blob for win-x64 and android-arm64 only). Harmless: every
      # reference to it goes through Engine.has_singleton("MetaXRAudio"), so
      # nothing names it statically, and its Android library is still packed
      # into the APK straight from the .gdextension file.
      - name: Build the host-side extensions the editor needs (linux, debug)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: python /w/Tools/build.py linux --target debug --jobs 4

      # The Linux build links libSDL3.so.0 by SONAME - external/SDL3/lib/linux-x64
      # is a link-time stand-in and the runtime copy is expected to come from the
      # host, which a runner has no SDL3 on. Without this the editor cannot open
      # libretro_godot.linux...so at all, Libretro never reaches ClassDB, and
      # every script naming it fails to parse. LD_LIBRARY_PATH rather than
      # copying the .so next to the extension, which would risk it being packed
      # into the APK.
      - name: Put the vendored SDL3 on the runtime path
        run: |
          set -euo pipefail
          sdl=$GITHUB_WORKSPACE/libretro-godot/external/SDL3/lib/linux-x64
          test -f "$sdl/libSDL3.so.0"
          echo "LD_LIBRARY_PATH=$sdl${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('RetroXR/export_presets.cfg') }}
          restore-keys: gradle-

      - name: Install Godot ${{ env.GODOT_VERSION }} and its export templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip && chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR
          mv templates/* ~/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/
          rm -f godot.zip templates.tpz
          godot --version

      # Before anything else touches the project, because a cold .godot/ makes
      # Godot abort with "Main scene's path could not be resolved from UID.
      # Make sure the project is imported first" - which is exactly what
      # --install-android-build-template did until this ran ahead of it.
      #
      # Two passes, and only the second is an oracle. On the cold first pass the
      # editor parses scripts before the image importers have run, so every
      # preload() of a .png or .svg fails with "has no resource loaders" and
      # takes each depending script down with it. --import is not a substitute:
      # it aborts on the same unimported-project check and imports nothing.
      - name: Import the project
        run: |
          set -euo pipefail
          for pass in 1 2; do
            godot --headless --path RetroXR --editor --quit > "import$pass.log" 2>&1 || true
            echo "pass $pass: $(grep -acE 'SCRIPT ERROR|Parse Error|SHADER ERROR' "import$pass.log") script/shader errors"
          done

      - name: Install the Android build template
        run: |
          set -euo pipefail
          godot --headless --path RetroXR --install-android-build-template --quit || true
          if [ ! -f RetroXR/android/build/build.gradle ]; then
            # Fallback: the template is just android_source.zip out of the .tpz.
            echo "CLI install produced nothing - unpacking android_source.zip"
            mkdir -p RetroXR/android/build
            unzip -q ~/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/android_source.zip \
              -d RetroXR/android/build
            echo "$GODOT_TEMPLATE_DIR" > RetroXR/android/.build_version
            touch RetroXR/android/.gdignore
          fi
          # A cached gradle dir can re-serve a stale .gdc; the assets staging
          # dirs are never worth keeping between runs.
          rm -rf RetroXR/android/build/src/main/assets \
                 RetroXR/android/build/build/intermediates/assets
          cat RetroXR/android/.build_version

      - name: Fail on any script or shader error
        run: |
          set -euo pipefail
          # Known headless noise, none of it caused by the build. Every
          # extension with a linux stanza is built above and must load, so none
          # is excused here - only metaxr-audio, which has no linux library to
          # find at all.
          grep -aE "SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|Failed to instantiate" import2.log \
            | grep -avE "xrCreateInstance|\.NET Sdk|xr_staging_shim|metaxr" \
            > errors.log || true
          if [ -s errors.log ]; then cat errors.log; echo "::error::import reported errors"; exit 1; fi
          echo "import clean"

      - name: Export the signed Quest APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK: ${{ needs.preflight.outputs.apk_name }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::secret ANDROID_KEYSTORE_BASE64 is unset"; exit 1; }
          # Never written to the tree: RetroXR/.godot/export_credentials.cfg
          # stays absent and the keystore lives only in the runner temp dir.
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          mkdir -p build_out
          godot --headless --path RetroXR --export-release "Quest" "$PWD/build_out/$APK"
          ls -la "build_out/$APK"

      - name: Check the APK
        env:
          APK: build_out/${{ needs.preflight.outputs.apk_name }}
          WANT_CODE: ${{ needs.preflight.outputs.version_code }}
          WANT_NAME: ${{ needs.preflight.outputs.version_name }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt2=$(find "$sdk/build-tools" -name aapt2 -type f | sort | tail -1)
          [ -x "$aapt2" ] || { echo "::error::no aapt2 under $sdk/build-tools"; exit 1; }
          badging=$("$aapt2" dump badging "$APK")
          code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging" | head -1)
          name=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)
          echo "apk: versionCode=$code versionName=$name"
          [ "$code" = "$WANT_CODE" ] || { echo "::error::versionCode $code != preset $WANT_CODE"; exit 1; }
          [ "$name" = "$WANT_NAME" ] || { echo "::error::versionName $name != preset $WANT_NAME"; exit 1; }

          size=$(stat -c%s "$APK")
          [ "$size" -gt 100000000 ] || { echo "::error::APK is only $size bytes - assets are probably missing"; exit 1; }

          # One missing native drops the whole GDExtension at runtime, and a
          # missing vendors .so has previously shipped a Quest build with no
          # passthrough. The APK is the only ground truth for this.
          for lib in liblibretro_godot libverlet_rope libvlc_godot libgodot-pdfium \
                     libmetaxr-audio libgodotopenxrvendors libvlc.so libpdfium.so \
                     libMetaXRAudioUnity.so; do
            unzip -Z1 "$APK" | grep -q "lib/arm64-v8a/$lib" || {
              echo "::error::APK is missing lib/arm64-v8a/$lib*"; exit 1; }
          done
          echo "all expected natives present"

      - uses: actions/upload-artifact@v4
        with:
          name: quest-apk
          path: build_out/${{ needs.preflight.outputs.apk_name }}
          compression-level: 0   # an APK is already a zip
          retention-days: 14

  # ------------------------------------------------------------------ windows
  windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, lfs: true, fetch-depth: 0 }

      - run: pip install scons

      # No Vulkan SDK install: vulkan-1.lib is vendored in the libretro-godot
      # submodule (external/vulkan-loader/), which is the whole reason a Windows
      # runner needs nothing beyond MSVC here.
      #
      # Both targets, and both are needed: the exported .exe loads
      # windows.release.x86_64, while the editor doing the exporting is itself
      # debug-tagged and loads windows.debug.x86_64 to register the classes the
      # project's scenes and scripts name. Only the release ones ship.
      - name: Build the five GDExtensions (windows x86_64, debug + release)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: python Tools/build.py windows --target both

      - name: Install Godot ${{ env.GODOT_VERSION }} and its export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION"
          Invoke-WebRequest "$base/Godot_v${env:GODOT_VERSION}_win64.exe.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v${env:GODOT_VERSION}_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive godot.zip -DestinationPath godot-bin
          # Use the _console variant: the plain exe detaches from stdout on
          # Windows, so the import step would grep an empty log and pass no
          # matter what the editor reported. It must keep its own filename -
          # the wrapper locates the real exe by stripping "_console" from it.
          "GODOT=$PWD/godot-bin/Godot_v${env:GODOT_VERSION}_win64_console.exe" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Rename-Item templates.tpz templates.zip
          Expand-Archive templates.zip -DestinationPath tpz
          $dest = "$env:APPDATA\Godot\export_templates\$env:GODOT_TEMPLATE_DIR"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item tpz/templates/* $dest
          Remove-Item godot.zip, templates.zip -Force

      - name: Import, and fail on any script or shader error
        shell: bash
        run: |
          set -euo pipefail
          # Two full editor passes; see the quest job for why the first is not
          # an oracle on a cold .godot/ and why --import cannot stand in for it.
          for pass in 1 2; do
            "$GODOT" --headless --path RetroXR --editor --quit > "import$pass.log" 2>&1 || true
            echo "pass $pass: $(grep -acE 'SCRIPT ERROR|Parse Error|SHADER ERROR' "import$pass.log") script/shader errors"
          done
          # All five extensions have a windows stanza and are built above, so
          # none is excused - a load failure here is a real one.
          grep -aE "SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|Failed to instantiate" import2.log \
            | grep -avE "xrCreateInstance|\.NET Sdk|xr_staging_shim" > errors.log || true
          if [ -s errors.log ]; then cat errors.log; echo "::error::import reported errors"; exit 1; fi
          echo "import clean"

      - name: Export the Windows desktop build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_out
          "$GODOT" --headless --path RetroXR --export-release "Windows Desktop" "$PWD/build_out/RetroXR.exe"
          ls -la build_out

      - name: Package
        shell: bash
        env: { VER: "${{ needs.preflight.outputs.version_name }}" }
        run: |
          set -euo pipefail
          # The exe alone will not run: the export drops libvlc.dll, the VLC
          # plugin tree, libpdfium.dll and the MetaXR blob alongside it.
          python -c "import shutil; shutil.make_archive('RetroXR-win-v$VER', 'zip', 'build_out')"
          ls -la "RetroXR-win-v$VER.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: RetroXR-win-v${{ needs.preflight.outputs.version_name }}.zip
          compression-level: 0
          retention-days: 14

  # ------------------------------------------------------------------ release
  release:
    needs: [preflight, quest, windows]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.preflight.outputs.version_name) }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$TAG" --title "RetroXR $TAG" --generate-notes dist/*

      # A release created with GITHUB_TOKEN does NOT fire `on: release:
      # published`, so sidequest.yml would never see it. SideQuest's
      # version-webhook takes the APK url directly, which sidesteps that
      # entirely and needs no PAT.
      - name: Point SideQuest at the new APK
        env:
          WEBHOOK: ${{ secrets.SIDEQUEST_RELEASE_WEBHOOK }}
          CODE: ${{ needs.preflight.outputs.version_code }}
          APK: ${{ needs.preflight.outputs.apk_name }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.preflight.outputs.version_name) }}
          NOTIFY: ${{ github.ref_type == 'tag' || inputs.notify }}
        run: |
          set -euo pipefail
          [ -n "${WEBHOOK:-}" ] || { echo "::error::secret SIDEQUEST_RELEASE_WEBHOOK is unset"; exit 1; }
          url="${WEBHOOK/release-webhook/version-webhook/$CODE}"
          body="{\"url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK\"}"

          if [ "$NOTIFY" != true ]; then
            # Actions masks the secret itself, not a substring of it, so the
            # token has to be redacted by hand before anything is printed.
            echo "notify is off - would POST:"
            echo "  curl -X POST '$(sed 's#\(version-webhook/[0-9]*/\).*#\1<TOKEN>#' <<<"$url")'"
            echo "  body: $body"
            exit 0
          fi

          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$url" \
                   -H 'Content-Type: application/json' -d "$body")
          echo "HTTP $code"; cat resp.txt; echo
          # A 2xx only means SideQuest accepted the payload; whether it takes the
          # build still depends on the versionCode, which the listing decides.
          case "$code" in
            2*) echo "SideQuest updated to versionCode $CODE" ;;
            *)  echo "::error::SideQuest webhook returned $code"; exit 1 ;;
          esac
